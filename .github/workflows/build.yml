name: Build and deploy image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: piparo-pr-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/piparotech/piparo-pr-agent
  INFRA_REPOSITORY: piparotech/infra
  INFRA_MANIFESTS: pr-agent/pr-agent.yaml,pr-agent/forgejo.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: PYTHONPATH=. pytest tests/unittest -q

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set deploy image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "tag=$(date -u +%F)-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set creation timestamp
        id: created
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          SHORT_SHA: ${{ steps.image-tag.outputs.short_sha }}
          CREATED: ${{ steps.created.outputs.timestamp }}
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:${SHORT_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            .
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:${SHORT_SHA}"
          docker push "${IMAGE_NAME}:latest"

  update-infra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    env:
      DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Require deploy token
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "DEPLOY_PAT is required to update piparotech/infra." >&2
            exit 1
          fi

      - name: Checkout infra repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          token: ${{ secrets.DEPLOY_PAT }}
          path: infra-repo

      - name: Update PR-Agent image tags
        id: update
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifests = [Path("infra-repo") / item.strip() for item in os.environ["INFRA_MANIFESTS"].split(",")]
          image_name = os.environ["IMAGE_NAME"]
          image = f"{image_name}:{os.environ['IMAGE_TAG']}"
          image_pattern = re.compile(rf"^(\s*image:\s*){re.escape(image_name)}:[^\s]+(\s*)$")
          updated = []

          for manifest in manifests:
              lines = manifest.read_text(encoding="utf-8").splitlines(keepends=True)
              matches = []
              for index, line in enumerate(lines):
                  newline = "\n" if line.endswith("\n") else ""
                  match = image_pattern.match(line.rstrip("\n"))
                  if match:
                      matches.append(index)
                      lines[index] = f"{match.group(1)}{image}{match.group(2)}{newline}"

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one {image_name} image in {manifest}, found {len(matches)}"
                  )
              manifest.write_text("".join(lines), encoding="utf-8")
              updated.append(str(manifest.relative_to("infra-repo")))

          print(f"Updated manifests: {', '.join(updated)}")
          PY

          IFS=',' read -ra manifests <<< "$INFRA_MANIFESTS"
          if git -C infra-repo diff --quiet -- "${manifests[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push infra change
        if: steps.update.outputs.changed == 'true'
        run: |
          git -C infra-repo config user.name "github-actions[bot]"
          git -C infra-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          IFS=',' read -ra manifests <<< "$INFRA_MANIFESTS"
          git -C infra-repo add "${manifests[@]}"
          git -C infra-repo commit -m "Deploy PR-Agent ${IMAGE_TAG}"
          git -C infra-repo push

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "### piparo-pr-agent deploy"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Infra manifests: \`${INFRA_MANIFESTS}\`"
            echo "- Infra changed: \`${{ steps.update.outputs.changed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
